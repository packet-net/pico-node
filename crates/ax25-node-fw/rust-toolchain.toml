# Pin the toolchain + the embedded target for the firmware crate, so a clean
# checkout on a machine with rustup just works: `rustup` reads this and installs
# the stable channel plus the thumbv6m-none-eabi target component.
#
# NOTE: this is only honoured by rustup. The current planning environment has a
# system (Debian-packaged) rustc with no rustup and no thumbv6m core, so it is
# inert here — it takes effect once a rustup toolchain is installed (see
# docs/PLAN.md §"Package approval list").
#
# Embassy targets stable Rust (no nightly needed for the RP2040 path).

[toolchain]
# Pinned (was floating "stable") to the same 1.93.1 the rest of CI runs, per
# the repo rule: pin the toolchain the suite was last green on, bump
# deliberately. Floating stable meant each new clippy release could break the
# fw lint gate with lints nobody had seen locally.
channel = "1.93.1"
# clippy is listed so rustup provisions it for THIS resolved toolchain: this
# file overrides the CI job's dtolnay-installed toolchain inside the crate
# directory, so a clippy installed only there is invisible here (the fw clippy
# gate found that out the hard way).
components = ["rust-src", "llvm-tools", "clippy"]
targets = ["thumbv6m-none-eabi"]
